<!DOCTYPE html>
<html lang="de" data-theme="nordic-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SwapDoku — Minimal Sudoku</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="app">
    <!-- Header mit Titel, Theme-Umschalter, Rangliste & Punkte -->
    <header class="header">
      <div class="brand">
        <h1>SwapDoku</h1>
      </div>
      <div class="header-actions">
        <!-- Schneller Dark-/Light-Mode Umschalter -->
        <button class="icon-toggle" id="themeToggleBtn" title="Hell/Dunkel umschalten" aria-label="Hell/Dunkel Modus">
          <span id="themeToggleIcon">☾</span>
        </button>
        <!-- Rangliste Button -->
        <button class="icon-toggle" id="openLeaderboardBtn" title="Rangliste öffnen" aria-label="Rangliste">
          <span>🏆</span>
        </button>
        <!-- Punkte-Pill -->
        <button class="pill-btn" id="openShopBtn" title="Themes & Punkte">
          <span class="pts-val" id="userPoints">0</span> Pts
        </button>
      </div>
    </header>

    <!-- Modi -->
    <nav class="modes">
      <button class="mode-btn active" data-mode="zen" id="tabZen" title="Klassisches Einzelspieler-Sudoku">Zen</button>
      <button class="mode-btn" data-mode="versus" id="tabVersus" title="Gegen Mitspieler oder Bot">Versus</button>
      <button class="mode-btn" data-mode="swap" id="tabSwap" title="Kooperativer Board-Swap">Co-Op Swap</button>
    </nav>

    <!-- Einzelspieler-Schwierigkeit (Nur bei Zen sichtbar) -->
    <section class="zen-bar" id="zenDifficultyBar">
      <div class="zen-diff-row">
        <span class="diff-label">Schwierigkeit:</span>
        <div class="diff-buttons">
          <button class="diff-btn" data-diff="easy" id="zenDiffEasy">Einfach (5 ❤)</button>
          <button class="diff-btn active" data-diff="medium" id="zenDiffMedium">Mittel (3 ❤)</button>
          <button class="diff-btn" data-diff="hard" id="zenDiffHard">Schwer (1 ❤)</button>
        </div>
      </div>
    </section>

    <!-- Multiplayer Lobby mit Online- oder Bot-Wahl -->
    <section class="lobby hidden" id="multiplayerLobby">
      <!-- Spieler-Typ: Online oder Bot -->
      <div class="lobby-switch">
        <button class="sub-tab active" id="btnPlayOnline">Online (Raum)</button>
        <button class="sub-tab" id="btnPlayBot">Mit Bot spielen</button>
      </div>

      <!-- Online Bereich (Raum erstellen / beitreten) -->
      <div class="online-box" id="onlineSection">
        <div class="lobby-row">
          <button class="btn" id="createRoomBtn">Raum erstellen</button>
          <span class="divider">oder</span>
          <div class="join-box">
            <input type="text" id="roomCodeInput" maxlength="4" placeholder="CODE" spellcheck="false" autocomplete="off">
            <button class="btn" id="joinRoomBtn">Beitreten</button>
          </div>
        </div>
        <div class="lobby-info">
          <span id="roomCodeDisplay" class="hidden">Raum: <strong id="currentRoomCode">----</strong></span>
          <span class="status-indicator">
            <span class="dot" id="connDot"></span>
            <span id="connText">Nicht verbunden</span>
          </span>
        </div>
      </div>

      <!-- Bot Bereich (Falls kein Mitspieler vorhanden) -->
      <div class="bot-box hidden" id="botSection">
        <div class="bot-difficulty-row">
          <span class="diff-label">Bot-Stufe:</span>
          <div class="diff-buttons">
            <button class="diff-btn" data-diff="easy" id="diffEasy">Einfach</button>
            <button class="diff-btn active" data-diff="medium" id="diffMedium">Mittel</button>
            <button class="diff-btn" data-diff="hard" id="diffHard">Schwer</button>
          </div>
        </div>
        <div class="bot-start-row">
          <button class="btn btn-primary" id="btnStartBotGame">Spiel gegen Bot starten</button>
          <span class="bot-desc" id="botStatusText">Bereit zum Start.</span>
        </div>
      </div>
    </section>

    <!-- Info / HUD (Herzen, Timer, Versus-Progress) -->
    <section class="hud" id="gameHud">
      <!-- Herzen / Fehler-Anzeige -->
      <div class="hearts-wrap" id="heartsWrap" title="Verbleibende Leben">
        <span class="hearts-icons" id="heartsDisplay">❤❤❤</span>
      </div>

      <!-- Versus Progress -->
      <div class="versus-wrap hidden" id="versusBars">
        <div class="bar-row">
          <span>Du</span>
          <div class="bar-track"><div class="bar-fill" id="playerProgressBar"></div></div>
          <span class="bar-pct" id="playerProgressLabel">0%</span>
        </div>
        <div class="bar-row">
          <span id="opponentLabelText">Gegner</span>
          <div class="bar-track"><div class="bar-fill opponent" id="opponentProgressBar"></div></div>
          <span class="bar-pct" id="opponentProgressLabel">0%</span>
        </div>
      </div>

      <!-- Swap Timer -->
      <div class="swap-wrap hidden" id="swapTimerBox">
        <span id="swapPartnerLabel">Swap in</span>
        <strong id="swapTimer">10s</strong>
      </div>
    </section>

    <!-- 9x9 Sudoku Feld -->
    <main class="grid-wrap">
      <div class="sudoku-grid" id="sudokuGrid"></div>
    </main>

    <!-- Steuerleiste -->
    <section class="controls">
      <div class="toolbar">
        <button class="tool-btn" id="btnNotes">Notizen: Aus</button>
        <button class="tool-btn" id="btnErase">Löschen</button>
        <button class="tool-btn" id="btnNewGame">Neu</button>
      </div>

      <div class="numpad" id="numpad">
        <button class="num" data-num="1">1</button>
        <button class="num" data-num="2">2</button>
        <button class="num" data-num="3">3</button>
        <button class="num" data-num="4">4</button>
        <button class="num" data-num="5">5</button>
        <button class="num" data-num="6">6</button>
        <button class="num" data-num="7">7</button>
        <button class="num" data-num="8">8</button>
        <button class="num" data-num="9">9</button>
      </div>
    </section>
  </div>

  <!-- Theme Modal -->
  <div class="modal hidden" id="themeModal">
    <div class="modal-card">
      <div class="modal-top">
        <h2>Themes & Farben</h2>
        <button class="close-btn" id="closeShopBtn">&times;</button>
      </div>
      <div class="theme-list" id="themesContainer"></div>
    </div>
  </div>

  <!-- Rangliste & Profil Modal -->
  <div class="modal hidden" id="leaderboardModal">
    <div class="modal-card">
      <div class="modal-top">
        <h2>Rangliste (Leaderboard)</h2>
        <button class="close-btn" id="closeLeaderboardBtn">&times;</button>
      </div>
      <div class="player-profile-box">
        <label for="usernameInput" class="profile-label">Dein Spielername:</label>
        <div class="name-edit-row">
          <input type="text" id="usernameInput" maxlength="16" placeholder="Spielername" spellcheck="false">
          <button class="btn" id="btnSaveUsername">Speichern</button>
        </div>
        <div class="my-rank-info" id="myRankInfo">
          Dein Rang: <strong>Lädt...</strong> &bull; Punkte: <strong id="myRankPoints">0</strong>
        </div>
      </div>
      <div class="leaderboard-table-wrap">
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>Rang</th>
              <th>Spieler</th>
              <th style="text-align: right;">Punkte</th>
            </tr>
          </thead>
          <tbody id="leaderboardBody">
            <!-- Dynamische Zeilen -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast hidden" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
